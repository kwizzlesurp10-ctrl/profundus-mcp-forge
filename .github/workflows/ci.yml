name: CI - Test Parity

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Local Smoke Test (Parity)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pre-commit

      - name: Run local smoke test
        run: make test

      - name: Run pre-commit hooks
        run: pre-commit run --all-files || true  # non-blocking for now